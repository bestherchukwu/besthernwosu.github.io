<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>text{font-family:Arial,sans-serif;fill:#102030}.box{fill:#fff;stroke:#102030;stroke-width:2;rx:12}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px}.arrow{stroke:#52606d;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#52606d"/></marker></defs><text x="40" y="45" class="title">CICOD SaaS on AWS — Sanitized Architecture</text><rect x="55" y="95" width="170" height="75" class="box"/><text x="100" y="130" class="label">Users</text><text x="85" y="153" class="small">Internet clients</text><rect x="275" y="95" width="180" height="75" class="box"/><text x="325" y="130" class="label">DNS</text><text x="300" y="153" class="small">Route 53 / domain</text><rect x="505" y="95" width="190" height="75" class="box"/><text x="550" y="130" class="label">Load Balancer</text><text x="545" y="153" class="small">Traffic distribution</text><rect x="745" y="80" width="190" height="105" class="box"/><text x="800" y="120" class="label">VPC</text><text x="775" y="145" class="small">Public/private tiers</text><text x="775" y="168" class="small">Security controls</text><rect x="745" y="255" width="190" height="80" class="box"/><text x="800" y="290" class="label">EC2</text><text x="775" y="313" class="small">Application compute</text><rect x="745" y="390" width="190" height="80" class="box"/><text x="790" y="425" class="label">RDS / MySQL</text><text x="775" y="448" class="small">Persistent data</text><rect x="405" y="390" width="220" height="80" class="box"/><text x="455" y="425" class="label">S3 / Storage</text><text x="435" y="448" class="small">Object / backup storage</text><rect x="405" y="520" width="220" height="75" class="box"/><text x="455" y="555" class="label">CloudWatch</text><text x="435" y="578" class="small">Monitoring & alerts</text><path d="M225 132H275M455 132H505M695 132H745M840 185V255M840 335V390M745 430H625M515 470V520M935 132H1050V555H625" class="arrow"/><text x="55" y="625" class="small">Sanitized view — service topology is representative; no credentials, private addresses or proprietary configuration.</text></svg>